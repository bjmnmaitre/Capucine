<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capucine — Votre agent d'achat</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <a class="skip-link" href="#conversation-slot">Aller au contenu</a>

  <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="app-shell" class="app-shell">
    <aside class="sidebar" id="sidebar-slot" aria-label="Navigation Capucine"></aside>

    <div class="workspace">
      <main class="workspace-scroll" id="conversation-scroll" tabindex="-1">
        <div class="workspace-inner" id="conversation-slot"></div>
      </main>
      <div id="composer-slot"></div>
      <p id="config-status" class="config-status" aria-live="polite"></p>
    </div>
  </div>

  <div id="settings-slot"></div>

  <!-- Vanilla ES5-compatible modules, no bundler, no build step — loaded in
       dependency order. Each file dual-exports (UMD-lite): plain global
       here in the browser, CommonJS in Jest (see js/*.js headers). -->
  <script src="/js/i18n.js"></script>
  <script src="/js/locales/fr.js"></script>
  <script src="/js/locales/en.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/criteria.js"></script>
  <script src="/js/coverage.js"></script>
  <script src="/js/product-grouping.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/render/sidebar.js"></script>
  <script src="/js/render/composer.js"></script>
  <script src="/js/render/conversation.js"></script>
  <script src="/js/render/results.js"></script>
  <script src="/js/render/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
